version: '3.8'

services:
  db:
    image: postgres:16
    container_name: dobetter_db
    restart: always
    environment:
      POSTGRES_USER: dobetter_admin
      POSTGRES_PASSWORD: MySecurePassword123!
      POSTGRES_DB: dobetter_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: